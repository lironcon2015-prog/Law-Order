<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>LexBudget · דמו</title>
  <meta name="description" content="LexBudget — ניהול תקציב עסקאות M&amp;A: תקציב לפי צוותים ודרגות, ייבוא דוחות שעות, ובקרת תקציב מול ביצוע בשעות או בשקלים. offline-first." />

  <meta name="theme-color" content="#f4f2ed" />
  <meta name="color-scheme" content="light dark" />
  <link rel="manifest" href="../manifest.json" />
  <link rel="apple-touch-icon" href="../icons/icon-192.png" />
  <script>
    /* ערכת הנושא נקבעת לפני הציור הראשון — בלי הבהוב של מצב בהיר כשנבחר כהה */
    try {
      if (localStorage.getItem('lb_theme') === 'dark') {
        document.documentElement.dataset.theme = 'dark';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0c111a');
      }
    } catch (e) { /* localStorage חסום — נשאר בהיר */ }
  </script>

  <link rel="preload" href="../fonts/heebo-hebrew.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="../css/fonts.css" />
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="./preview.css" />
  <script>window.LB_DB_NAME = "lexBudgetPreviewDB";</script>
</head>
<body>
  <div class="app" id="app">
    <!-- סרגל הצד מרונדר ב-JS (ui-overview.js → renderSidebar) -->
    <aside class="side" id="side" aria-label="ניווט ראשי"></aside>
    <div class="scrim" data-action="close-nav" aria-hidden="true"></div>

    <div class="content">
      <!-- פס עליון — במסכים צרים בלבד; הסרגל נפתח ממנו כמגירה -->
      <header class="mbar">
        <button class="iconbtn" type="button" data-action="toggle-nav" aria-label="פתיחת הניווט">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg>
        </button>
        <span class="side__logo" aria-hidden="true">LB</span>
        <span class="mbar__title" id="mbar-title">LexBudget</span>
      </header>
      <main class="main" id="main"></main>
    </div>
  </div>

  <dialog class="modal" id="modal">
    <div class="modal__head">
      <h2 id="modal-title"></h2>
      <button class="modal__close" type="button" data-action="modal-close" aria-label="סגור">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <div class="modal__body" id="modal-body"></div>
    <div class="modal__foot" id="modal-foot"></div>
  </dialog>

  <input type="file" id="hidden-file" hidden />

  <!-- סביבת דמו: אותה אפליקציה, מסד נפרד עם עסקאות לדוגמה -->
  <div class="demo-bar" role="note">
    <span>סביבת דמו · הנתונים כאן לדוגמה ואינם נוגעים בנתונים האמיתיים</span>
    <button type="button" id="demo-reset" title="מחיקת נתוני הדמו ובנייה מחדש">איפוס דמו</button>
  </div>
  <script type="module" src="../js/app.js"></script>
  <script type="module">
    import { ensureDemo, resetDemo } from './demo.js';
    document.getElementById('demo-reset').addEventListener('click', resetDemo);
    ensureDemo();
  </script>
</body>
</html>
